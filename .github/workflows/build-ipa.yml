name: Build IPA

# Builds an unsigned .app and re-signs it with ldid + the bundled entitlements
# (same flow as ipabuild.sh, which needs a Mac - this mirrors it on CI so you
# can get an installable .ipa straight from GitHub without Xcode locally).

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build .app
        run: |
          set -euo pipefail
          xcodebuild \
            -project CarTube.xcodeproj \
            -scheme CarTube \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Strip signature, apply entitlements, package IPA
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Debug-iphoneos/CarTube.app"
          codesign --remove "$APP" || true
          rm -rf "$APP/_CodeSignature"
          rm -f "$APP"/embedded.mobileprovision
          ldid -SCarTube/CarTube.entitlements "$APP/CarTube"
          mkdir -p Payload
          rm -rf "Payload/CarTube.app"
          cp -R "$APP" "Payload/CarTube.app"
          rm -f CarTube.ipa
          zip -qr CarTube.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarTube-ipa
          path: CarTube.ipa

      # To publish a release: push a tag like v1.4-fork.1 and the workflow
      # attaches the IPA to a draft GitHub release you can install from.
      - name: Attach IPA to draft release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: CarTube.ipa
